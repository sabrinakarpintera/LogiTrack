<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom | LogiTrack</title>

<!-- Bootstrap -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Google Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<!-- Google Font: Outfit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Custom Styles -->
<link href="home.css" rel="stylesheet">
<link href="list-page.css" rel="stylesheet">
<link href="classroom-view.css" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-md">
  <div class="container-fluid px-0 d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a class="brand-logo" href="home.html">
      <img src="logo.png" alt="LogiTrack Logo" class="nav-logo-img">
    </a>

    <!-- Nav Links -->
    <ul class="nav nav-pill mb-0">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      <li class="nav-item"><a class="nav-link active" href="classroom.html">Classroom</a></li>
    </ul>

    <!-- Logout Button -->
    <button class="btn btn-logout"><a href="index.html">Log out</a></button>
  </div>
</nav>

<main>
  <div class="container">

    <!-- Page Header -->
    <div class="list-page-header">
      <a href="classroom.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Classroom</a>
      <div class="classroom-view-heading">
        <h1 class="list-page-title" id="classroomNameHeading">Classroom</h1>
        <span class="classroom-view-code" id="classroomCodeBadge">
          <span class="material-symbols-outlined">key</span>
          <span id="classroomCodeValue">------</span>
        </span>
      </div>
    </div>

    <!-- Sub Navigation -->
    <ul class="nav nav-pill classroom-subnav" id="classroomSubnav">
      <li class="nav-item">
        <button type="button" class="nav-link active" data-tab="students">Student List</button>
      </li>
      <li class="nav-item">
        <button type="button" class="nav-link" data-tab="capstone">Submitted Capstone Project</button>
      </li>
    </ul>

    <!-- Student List Panel -->
    <div class="classroom-panel" id="studentsPanel">
      <div class="list-page-card">
        <ul class="student-list" id="studentList"></ul>
      </div>
    </div>

    <!-- Submitted Capstone Panel -->
    <div class="classroom-panel d-none" id="capstonePanel">
      <div class="list-page-card">
        <div class="table-responsive">
          <table class="table capstone-table">
            <thead>
              <tr>
                <th>Title of the Study</th>
                <th>Author(s)</th>
              </tr>
            </thead>
            <tbody id="capstoneTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</main>

<footer>
  2026 | LOGITRACK: A CAPSTONE PROJECT REPOSITORY
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="classroom-view.js"></script>
</body>
</html>
