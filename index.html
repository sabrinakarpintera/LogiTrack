<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiTrack | Sign In</title>

<!-- Google Font: Outfit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center position-relative overflow-hidden">

  <!-- Ambient Background Accents -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Form Card Container -->
  <div class="form-card-container">

    <!-- Logo Centered Outside the Card -->
    <div class="text-center mb-3">
      <img src="logo.png" alt="LogiTrack Logo" class="external-brand-logo">
    </div>

    <!-- Form Card -->
    <div class="form-card">

      <h2 class="form-title">Welcome back</h2>
      <p class="form-subtitle">Sign in to access the capstone repository.</p>

      <form id="loginForm" novalidate>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group-custom">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input type="email" id="email" class="form-control custom-input" placeholder="you@cvsu.edu.ph" required>
          </div>
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <div class="input-group-custom">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input type="password" id="password" class="form-control custom-input" placeholder="Enter your password" required>
            <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
              <span class="material-symbols-outlined" id="toggleIcon">visibility</span>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div class="alert-box d-none" id="loginAlert">
          <span class="material-symbols-outlined" style="font-size:18px;">error</span>
          <span id="loginAlertText">Invalid email or password.</span>
        </div>

        <button type="submit" class="btn btn-login w-100" id="loginBtn">
          <span id="loginBtnText"><a href="home.html">Log In</a></span>
          <span class="spinner-border spinner-border-sm d-none" id="loginSpinner" role="status" aria-hidden="true"></span>
        </button>

      </form>

      <p class="signup-note">Don't have an account? <a href="signup.html">Sign up</a></p>

    </div>
  </div>

</div>

<script src="login.js"></script>
</body>
</html>
