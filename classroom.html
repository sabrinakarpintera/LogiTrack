<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom | LogiTrack</title>

<!-- Bootstrap -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Google Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<!-- Google Font: Outfit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Custom Styles -->
<link href="home.css" rel="stylesheet">
<link href="classroom.css" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-md">
  <div class="container-fluid px-0 d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <a class="brand-logo" href="home.html">
      <img src="logo.png" alt="LogiTrack Logo" class="nav-logo-img">
    </a>

    <!-- Nav Links -->
    <ul class="nav nav-pill mb-0">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      <li class="nav-item"><a class="nav-link active" href="classroom.html">Classroom</a></li>
    </ul>

    <!-- Logout Button -->
    <button class="btn btn-logout"><a href="index.html">Log out</a></button>
  </div>
</nav>

<main>
  <div class="container">

    <!-- Page Header -->
    <div class="hero-container classroom-hero">
      <h1 class="hero-title classroom-title">Your classroom at a glance.</h1>
    </div>

    <!-- Classroom List -->
    <div class="classroom-grid" id="classroomGrid">
      <div class="classroom-empty" id="classroomEmpty">
        <span class="material-symbols-outlined classroom-empty-icon">school</span>
        <p>You haven't created a classroom yet.</p>
      </div>
    </div>

  </div>
</main>

<!-- Floating "Create a Classroom" Button -->
<button type="button" class="fab-create" data-bs-toggle="modal" data-bs-target="#createClassroomModal" title="Create a Classroom">
  <span class="material-symbols-outlined">add</span>
  <span class="fab-label">Create a Classroom</span>
</button>

<footer>
  2026 | LOGITRACK: A CAPSTONE PROJECT REPOSITORY
</footer>

<!-- ===== Create a Classroom Modal ===== -->
<div class="modal fade" id="createClassroomModal" tabindex="-1" aria-labelledby="createClassroomModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createClassroomModalLabel">Create a Classroom</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="createClassroomForm">
          <div class="mb-3">
            <label for="classroomName" class="form-label">Classroom Name</label>
            <input type="text" class="form-control classroom-input" id="classroomName" placeholder="e.g. BSIT 4A - Capstone" required>
          </div>
          <div class="mb-1">
            <label for="classCode" class="form-label">Class Code</label>
            <div class="class-code-wrap">
              <input type="text" class="form-control classroom-input class-code-input" id="classCode" readonly>
              <button type="button" class="btn-generate-code" id="generateCodeBtn" title="Generate class code">
                <span class="material-symbols-outlined">refresh</span>
              </button>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel-classroom" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="createClassroomForm" class="btn-create-classroom">Create</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="classroom.js"></script>
</body>
</html>
